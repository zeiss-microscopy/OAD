name: Deploy ZEN API docs and build packages

"on":
  push:
    branches: [master, add_mkdocs_for_zenapi]
    paths:
      - ZEN-API/python_packages/**
      - ZEN-API/protofiles/**
      - ZEN-API/zen_api_utils_package/**
      - .github/scripts/**
      - .github/workflows/deploy-zen-api-docs.yml
  workflow_dispatch:
    inputs:
      versions:
        description: Space-separated ZEN API package versions to publish
        required: true
        default: "2026.07.1 2026.05.1 2025.10.1"
        type: string
      publish_releases:
        description: Attach built distributions to versioned GitHub Releases
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DOC_VERSIONS: ${{ inputs.versions || '2026.07.1 2026.05.1 2025.10.1' }}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  settings:
    name: Validate selected API versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve version matrix
        id: versions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          versions = list(dict.fromkeys(os.environ["DOC_VERSIONS"].split()))
          if not versions:
              raise SystemExit("Select at least one API version")
          for version in versions:
              if not re.fullmatch(r"[0-9]{4}\.[0-9]{2}\.[0-9]+", version):
                  raise SystemExit(f"Invalid API version: {version!r}")
              package = Path("ZEN-API/python_packages") / f"zen_api-{version}"
              with (package / "pyproject.toml").open("rb") as metadata:
                  project = tomllib.load(metadata)["project"]
              if project["name"] != "zen_api" or project["version"] != version:
                  raise SystemExit(f"Package metadata does not match selected API version: {version}")
              if not (Path("ZEN-API/protofiles") / f"proto_{version}").is_dir():
                  raise SystemExit(f"Matching proto directory missing for {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"versions={json.dumps(versions)}\n")
          PY

  build-packages:
    name: Build zen_api ${{ matrix.version }} distributions
    runs-on: ubuntu-latest
    needs: settings
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.settings.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package build dependencies
        run: python -m pip install --upgrade build twine "hatchling==1.27.0"
      - name: Build fresh wheel and source distribution
        env:
          API_VERSION: ${{ matrix.version }}
        run: |
          python -m build "ZEN-API/python_packages/zen_api-${API_VERSION}" --no-isolation --outdir "${RUNNER_TEMP}/zen-api-dist"
          python -m twine check "${RUNNER_TEMP}"/zen-api-dist/*
      - name: Upload versioned package artifact
        uses: actions/upload-artifact@v4
        with:
          name: zen_api-${{ matrix.version }}-python-package
          path: |
            ${{ runner.temp }}/zen-api-dist/*.whl
            ${{ runner.temp }}/zen-api-dist/*.tar.gz
          if-no-files-found: error

  deploy-docs:
    name: Deploy combined ZEN API documentation to GitHub Pages
    runs-on: ubuntu-latest
    needs: [settings, build-packages]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ZEN-API/zen_api_utils_package/pyproject.toml
      - name: Install Protocol Buffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          protoc --version
      - name: Install combined documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material "mkdocstrings[python]" pyyaml "betterproto==2.0.0b7" pytest
          python -m pip install numpy grpclib loguru pydantic ome-writers zarr ngff-zarr matplotlib
          python -m pip install --no-deps -e ./ZEN-API/zen_api_utils_package
      - name: Test combined documentation builder
        run: python -m pytest .github/scripts/tests/test_build_zen_api_docs.py -q
      - name: Build versioned MkDocs Material sites
        shell: bash
        run: |
          read -r -a versions <<< "$DOC_VERSIONS"
          python .github/scripts/build_zen_api_docs.py --versions "${versions[@]}"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish-releases:
    name: Publish zen_api ${{ matrix.version }} release assets
    if: github.event_name == 'workflow_dispatch' && inputs.publish_releases
    needs: [settings, build-packages, deploy-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.settings.outputs.versions) }}
    steps:
      - name: Download matching distributions
        uses: actions/download-artifact@v4
        with:
          name: zen_api-${{ matrix.version }}-python-package
          path: release-assets
      - name: Create or update versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.version }}
          name: ZEN API ${{ matrix.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: |
            release-assets/*.whl
            release-assets/*.tar.gz
          fail_on_unmatched_files: true