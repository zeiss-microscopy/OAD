name: Deploy ZEN API docs and build packages

"on":
    push:
        branches: [master, add_mkdocs_for_zenapi]
        paths:
            - ZEN-API/python_packages/**
            - ZEN-API/protofiles/**
            - ZEN-API/zen_api_utils/**
            - .github/scripts/**
            - .github/workflows/deploy-zen-api-docs.yml
    workflow_dispatch:
        inputs:
            versions:
                description: Space-separated ZEN API package versions to publish
                required: true
                default: "2026.7.1 2026.5.1"
                type: string
            publish_releases:
                description: Attach API distributions to versioned GitHub Releases
                required: true
                default: false
                type: boolean
            publish_utils_release:
                description: Publish the independently versioned zen_api_utils release
                required: true
                default: false
                type: boolean

permissions:
    contents: read
    pages: write
    id-token: write

env:
    DOC_VERSIONS: ${{ inputs.versions || '2026.7.1 2026.5.1' }}

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    settings:
        name: Validate selected API versions
        runs-on: ubuntu-latest
        outputs:
            versions: ${{ steps.versions.outputs.versions }}
            release_tags: ${{ steps.versions.outputs.release_tags }}
            utils_version: ${{ steps.versions.outputs.utils_version }}
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Install version validation dependencies
              run: python -m pip install packaging pyyaml "betterproto==2.0.0b7"
            - name: Resolve version matrix
              id: versions
              shell: bash
              run: |
                  python - <<'PY'
                  import json
                  import os
                  from pathlib import Path
                  from runpy import run_path
                  from packaging.version import Version

                  builder = run_path(".github/scripts/build_zen_api_docs.py")
                  versions = list(dict.fromkeys(os.environ["DOC_VERSIONS"].split()))
                  if not versions:
                      raise SystemExit("Select at least one API version")
                  try:
                      for version in versions:
                          _, utils = builder["validate_version"](Path.cwd(), version)
                      utils_version = utils["version"]
                      if not isinstance(utils_version, str) or str(Version(utils_version)) != utils_version:
                          raise ValueError(f"Invalid or noncanonical utility version: {utils_version!r}")
                  except (OSError, ValueError, KeyError) as exc:
                      raise SystemExit(str(exc)) from exc
                  legacy_tags = {"2026.5.1": "v2026.05.1", "2026.7.1": "v2026.07.1"}
                  release_tags = {version: legacy_tags.get(version, f"v{version}") for version in versions}
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"versions={json.dumps(versions)}\n")
                      output.write(f"release_tags={json.dumps(release_tags)}\n")
                      output.write(f"utils_version={utils_version}\n")
                  PY

    build-packages:
        name: Build zen_api ${{ matrix.version }} distributions
        runs-on: ubuntu-latest
        needs: settings
        strategy:
            fail-fast: false
            matrix:
                version: ${{ fromJSON(needs.settings.outputs.versions) }}
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Install package build dependencies
              run: python -m pip install --upgrade build twine "hatchling==1.27.0"
            - name: Build fresh wheel and source distribution
              env:
                  API_VERSION: ${{ matrix.version }}
              run: |
                  python -m build "ZEN-API/python_packages/zen_api-${API_VERSION}" --no-isolation --outdir "${RUNNER_TEMP}/zen-api-dist"
                  python -m twine check "${RUNNER_TEMP}"/zen-api-dist/*
            - name: Upload versioned package artifact
              uses: actions/upload-artifact@v4
              with:
                  name: zen_api-${{ matrix.version }}-python-package
                  path: |
                      ${{ runner.temp }}/zen-api-dist/*.whl
                      ${{ runner.temp }}/zen-api-dist/*.tar.gz
                  if-no-files-found: error

    build-utilities:
        name: Build zen_api_utils ${{ needs.settings.outputs.utils_version }} distributions
        runs-on: ubuntu-latest
        needs: settings
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: Install package build dependencies
              run: python -m pip install --upgrade build twine "hatchling==1.27.0"
            - name: Build utility wheel and source distribution once
              run: |
                  python -m build "ZEN-API/zen_api_utils" --no-isolation --outdir "${RUNNER_TEMP}/zen-api-utils-dist"
                  python -m twine check "${RUNNER_TEMP}"/zen-api-utils-dist/*
            - name: Upload utility package artifact
              uses: actions/upload-artifact@v4
              with:
                  name: zen_api_utils-${{ needs.settings.outputs.utils_version }}-python-package
                  path: |
                      ${{ runner.temp }}/zen-api-utils-dist/*.whl
                      ${{ runner.temp }}/zen-api-utils-dist/*.tar.gz
                  if-no-files-found: error

    test-utilities:
        name: Test utilities with API ${{ matrix.version }} on Python ${{ matrix.python }}
        runs-on: ubuntu-latest
        needs: [settings, build-packages, build-utilities]
        env:
            API_VERSION: ${{ matrix.version }}
            UTILS_VERSION: ${{ needs.settings.outputs.utils_version }}
        strategy:
            fail-fast: false
            matrix:
                version: ${{ fromJSON(needs.settings.outputs.versions) }}
                python: ["3.12", "3.13", "3.14", "3.15"]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python }}
                  cache: pip
                  cache-dependency-path: ZEN-API/zen_api_utils/pyproject.toml
            - name: Download matching API distributions
              uses: actions/download-artifact@v4
              with:
                  name: zen_api-${{ matrix.version }}-python-package
                  path: ${{ runner.temp }}/zen-api-dist
            - name: Download utility distributions
              uses: actions/download-artifact@v4
              with:
                  name: zen_api_utils-${{ needs.settings.outputs.utils_version }}-python-package
                  path: ${{ runner.temp }}/zen-api-utils-dist
            - name: Install matching API and utility wheels
              shell: bash
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install "${RUNNER_TEMP}"/zen-api-dist/*.whl
                  utility_wheels=("${RUNNER_TEMP}"/zen-api-utils-dist/*.whl)
                  python -m pip install "${utility_wheels[0]}[all]"
                  python -m pip check
            - name: Verify installed wheel pair
              shell: bash
              run: |
                  python - <<'PY'
                  import os
                  from importlib.metadata import version
                  from pathlib import Path
                  import zen_api_utils

                  assert version("zen_api") == os.environ["API_VERSION"]
                  assert version("zen_api_utils") == os.environ["UTILS_VERSION"]
                  source = Path("ZEN-API/zen_api_utils/src").resolve()
                  assert not Path(zen_api_utils.__file__).resolve().is_relative_to(source)
                  PY
            - name: Test utility wheel compatibility
              run: python -m pytest ZEN-API/zen_api_utils/tests -q -o pythonpath= --import-mode=importlib

    deploy-docs:
        name: Deploy combined ZEN API documentation to GitHub Pages
        runs-on: ubuntu-latest
        needs: [settings, build-packages, test-utilities]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: ZEN-API/zen_api_utils/pyproject.toml
            - name: Install Protocol Buffers compiler
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes protobuf-compiler
                  protoc --version
            - name: Install combined documentation dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install mkdocs-material "mkdocstrings[python]" pyyaml packaging "betterproto==2.0.0b7" pytest
                  python -m pip install numpy grpclib loguru pydantic ome-writers zarr ngff-zarr matplotlib
                  python -m pip install --no-deps -e ./ZEN-API/zen_api_utils
            - name: Test combined documentation builder
              run: python -m pytest .github/scripts/tests/test_build_zen_api_docs.py -q
            - name: Build versioned MkDocs Material sites
              shell: bash
              run: |
                  read -r -a versions <<< "$DOC_VERSIONS"
                  python .github/scripts/build_zen_api_docs.py --versions "${versions[@]}"
            - name: Configure GitHub Pages
              uses: actions/configure-pages@v6
            - name: Upload GitHub Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: site
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

    publish-releases:
        name: Publish zen_api ${{ matrix.version }} release assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish_releases
        needs: [settings, build-packages, deploy-docs]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                version: ${{ fromJSON(needs.settings.outputs.versions) }}
        steps:
            - name: Download matching distributions
              uses: actions/download-artifact@v4
              with:
                  name: zen_api-${{ matrix.version }}-python-package
                  path: release-assets
            - name: Create or update versioned GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ fromJSON(needs.settings.outputs.release_tags)[matrix.version] }}
                  name: ZEN API ${{ matrix.version }}
                  target_commitish: ${{ github.sha }}
                  make_latest: false
                  files: |
                      release-assets/*.whl
                      release-assets/*.tar.gz
                  fail_on_unmatched_files: true

    publish-utilities-release:
        name: Publish zen_api_utils ${{ needs.settings.outputs.utils_version }} release assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish_utils_release
        needs: [settings, build-utilities, test-utilities, deploy-docs]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download tested utility distributions
              uses: actions/download-artifact@v4
              with:
                  name: zen_api_utils-${{ needs.settings.outputs.utils_version }}-python-package
                  path: release-assets
            - name: Create or update utility GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: zen-api-utils-v${{ needs.settings.outputs.utils_version }}
                  name: ZEN API Utilities ${{ needs.settings.outputs.utils_version }}
                  target_commitish: ${{ github.sha }}
                  make_latest: false
                  files: |
                      release-assets/*.whl
                      release-assets/*.tar.gz
                  fail_on_unmatched_files: true
