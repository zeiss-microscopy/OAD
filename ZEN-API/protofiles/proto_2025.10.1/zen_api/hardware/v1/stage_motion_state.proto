syntax = "proto3";
package zen_api.hardware.v1;

// Stage motion state for ZenApi.
enum StageMotionState {
   // Default enum value.
   STAGE_MOTION_STATE_UNSPECIFIED = 0;
   // Should not occur in a well configured system.
   STAGE_MOTION_STATE_UNKNOWN = 1;
   // The stage cannot perform any task. Software restart and/or
   // physical intervention is required.
   STAGE_MOTION_STATE_ERROR = 2;
   // The stage is not moving.
   STAGE_MOTION_STATE_IDLE = 3;
   // The stage is in motion.
   STAGE_MOTION_STATE_MOVING = 4;
}
