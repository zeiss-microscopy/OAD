syntax = "proto3";
package zen_api.em.workflow.v1;

// WorkflowState.
enum WorkflowState {
   // Default value.
   WORKFLOW_STATE_UNSPECIFIED = 0;
   // Execution running.
   WORKFLOW_STATE_RUN_ACTIVE = 1;
   // Execution paused.
   WORKFLOW_STATE_RUN_PAUSED = 2;
   // Execution completed.
   WORKFLOW_STATE_RUN_COMPLETED = 3;
   // Execution failed.
   WORKFLOW_STATE_RUN_FAILED = 4;
   // Unknown status, e.g. no run so far.
   WORKFLOW_STATE_RUN_UNKNOWN = 5;
}
