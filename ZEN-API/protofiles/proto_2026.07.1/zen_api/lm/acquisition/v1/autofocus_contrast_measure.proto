syntax = "proto3";
package zen_api.lm.acquisition.v1;

// The contrast measures of the software autofocus contrast mode.
enum AutofocusContrastMeasure {
   // Default enum value.
   AUTOFOCUS_CONTRAST_MEASURE_UNSPECIFIED = 0;
   // The default contrast measure.
   AUTOFOCUS_CONTRAST_MEASURE_DEFAULT = 1;
   // The contrast measure to use in low-signal and calibration situations.
   AUTOFOCUS_CONTRAST_MEASURE_LOW_SIGNAL = 2;
}
