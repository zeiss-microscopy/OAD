syntax = "proto3";
package zen_api.lm.acquisition.v1;
import "zen_api/lm/acquisition/v1/time_unit_extended.proto";
import "zen_api/lm/acquisition/v1/time_unit.proto";

// Object representing the value of TimeSeriesInfo for the experiment.
message TimeSeriesInfo {
   // The value of the Duration.
   double duration = 1;
   // The value of the Duration Unit of measure.
   TimeUnitExtended duration_unit = 2;
   // A value indicating whether the duration is as long as possible.
   bool is_long_as_possible = 3;
   // The value of the Interval.
   double interval = 4;
   // The value of the Interval Uunit of measure.
   TimeUnit interval_unit = 5;
   // A value indicating whether the imaging is as fast as possible.
   bool is_fast_as_possible = 6;
   // A value indicating whether Burst Mode is used.
   bool is_burst_mode = 7;
}
