syntax = "proto3";
package zen_api.workflows.v2;
import "google/protobuf/timestamp.proto";
import "zen_api/workflows/v1/start_job_options.proto";
import "zen_api/workflows/v2/job_status.proto";

// Information about Job executed by the workflow runner contains a real-time updates and Job's events with Job state.
message JobInfo {
   // A Job unique runtime ID.
   string job_id = 1;
   // A date and time when JobInfo was created.
   .google.protobuf.Timestamp create_date = 2;
   // A Job execution state.
   JobStatus status = 3;
   // A Job starting options.
   .zen_api.workflows.v1.StartJobOptions start_options = 4;
}
