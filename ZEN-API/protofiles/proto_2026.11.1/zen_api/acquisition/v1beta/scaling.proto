syntax = "proto3";
package zen_api.acquisition.v1beta;

// Defines the scaling of the acquired frame.
message Scaling {
   // The scaling in X dimension (unit: m/pixel).
   double x = 1;
   // The scaling in Y dimension (unit: m/pixel).
   double y = 2;
}
