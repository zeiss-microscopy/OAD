syntax = "proto3";
package zen_api.em.hardware.v1;

// Request object to set the auto brightness-contrast settings.
message AutoBrightnessContrastSettings {
   // The detector to use.
   // Null will take the detector from the previous acquisition.
   string detector_name = 1;
   // The dwell time in seconds.
   // The closest dwell time to the selected one will be chosen.
   double dwell_time = 2;
   // The column to use for auto brightness-contrast.
   string column = 3;
   // The pixel resolution used for auto brightness-contrast.
   int32 pixel_count = 4;
}
