syntax = "proto3";
package zen_api.em.hardware.v1;

// Request object to set the autofocus fine settings.
message AutoFocusFineSettings {
   // The detector to use.
   // Null will take the detector from the previous acquisition.
   string detector_name = 1;
   // The focus search range delta in mm.
   double focus_range_delta = 2;
   // The target magnification.
   // For TargetMagnification = 0 the current magnification will be used as target magnification.
   int32 target_magnification = 3;
   // The dwell time in seconds.
   // The closest dwell time to the selected one will be chosen.
   double dwell_time = 4;
   // A value indicating whether to check the detectors brightness constrast settings during autofocus fine.
   bool check_bc = 5;
   // A value indicating whether the feature finder is active during autofocus fine.
   bool feature_finder_active = 6;
}
