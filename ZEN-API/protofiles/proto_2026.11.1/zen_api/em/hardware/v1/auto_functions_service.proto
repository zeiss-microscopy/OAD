syntax = "proto3";
package zen_api.em.hardware.v1;
import "zen_api/em/hardware/v1/auto_brightness_contrast_settings.proto";
import "zen_api/em/hardware/v1/auto_focus_coarse_settings.proto";
import "zen_api/em/hardware/v1/auto_focus_fine_settings.proto";
import "zen_api/em/hardware/v1/auto_stig_settings.proto";
import "zen_api/em/hardware/v1/auto_wobble_settings.proto";

// Response object of the RunAutoBrightnessContrast method of the ZenApi.EM.Hardware.V1.IAutoFunctionsApi.
message AutoFunctionServiceRunAutoBrightnessContrastResponse {
   // A value indicating whether the task to initialize the stage succeeded or not.
   bool task_success = 1;
   // A string message for display to the customer in failure case. This is only for display purpose and the message may change.
   // Empty string on success.
   string message = 2;
}
// Response object of the RunAutoFocusCoarse method of the ZenApi.EM.Hardware.V1.IAutoFunctionsApi.
message AutoFunctionServiceRunAutoFocusCoarseResponse {
   // A value indicating whether the task to initialize the stage succeeded or not.
   bool task_success = 1;
   // A string message for display to the customer in failure case. This is only for display purpose and the message may change.
   // Empty string on success.
   string message = 2;
}
// Response object of the RunAutoFocusFine method of the ZenApi.EM.Hardware.V1.IAutoFunctionsApi.
message AutoFunctionServiceRunAutoFocusFineResponse {
   // A value indicating whether the task to initialize the stage succeeded or not.
   bool task_success = 1;
   // A string message for display to the customer in failure case. This is only for display purpose and the message may change.
   // Empty string on success.
   string message = 2;
}
// Response object of the RunAutoStigCoarse method of the ZenApi.EM.Hardware.V1.IAutoFunctionsApi.
message AutoFunctionServiceRunAutoStigCoarseResponse {
   // A value indicating whether the task to initialize the stage succeeded or not.
   bool task_success = 1;
   // A string message for display to the customer in failure case. This is only for display purpose and the message may change.
   // Empty string on success.
   string message = 2;
}
// Response object of the RunAutoStigFine method of the ZenApi.EM.Hardware.V1.IAutoFunctionsApi.
message AutoFunctionServiceRunAutoStigFineResponse {
   // A value indicating whether the task to initialize the stage succeeded or not.
   bool task_success = 1;
   // A string message for display to the customer in failure case. This is only for display purpose and the message may change.
   // Empty string on success.
   string message = 2;
}
// Response object of the RunAutoWobble method of the ZenApi.EM.Hardware.V1.IAutoFunctionsApi.
message AutoFunctionServiceRunAutoWobbleResponse {
   // A value indicating whether the task to initialize the stage succeeded or not.
   bool task_success = 1;
   // A string message for display to the customer in failure case. This is only for display purpose and the message may change.
   // Empty string on success.
   string message = 2;
}
// Response object of the StopAutoFunction method of the ZenApi.EM.Hardware.V1.IAutoFunctionsApi.
message AutoFunctionServiceStopAutoFunctionResponse {
   // A value indicating whether the task to initialize the stage succeeded or not.
   bool task_success = 1;
   // A string message for display to the customer in failure case. This is only for display purpose and the message may change.
   // Empty string on success.
   string message = 2;
}
// The AutoFunctionsServiceRunAutoBrightnessContrastRequest class.
message AutoFunctionsServiceRunAutoBrightnessContrastRequest {
   // The imaging settings used run the auto brightness-contrast procedure.
   AutoBrightnessContrastSettings settings = 1;
}
// The AutoFunctionsServiceRunAutoFocusCoarseRequest class.
message AutoFunctionsServiceRunAutoFocusCoarseRequest {
   // The imaging settings used run the autofocus coarse procedure.
   AutoFocusCoarseSettings settings = 1;
}
// The AutoFunctionsServiceRunAutoFocusFineRequest class.
message AutoFunctionsServiceRunAutoFocusFineRequest {
   // The imaging settings used run the autofocus fine procedure.
   AutoFocusFineSettings settings = 1;
}
// The AutoFunctionsServiceRunAutoStigCoarseRequest class.
message AutoFunctionsServiceRunAutoStigCoarseRequest {
   // The imaging settings used run the autostig coarse procedure.
   AutoStigSettings settings = 1;
}
// The AutoFunctionsServiceRunAutoStigFineRequest class.
message AutoFunctionsServiceRunAutoStigFineRequest {
   // The imaging settings used run the autostig fine procedure.
   AutoStigSettings settings = 1;
}
// The AutoFunctionsServiceRunAutoWobbleRequest class.
message AutoFunctionsServiceRunAutoWobbleRequest {
   // The imaging settings used run the autowobble procedure.
   AutoWobbleSettings settings = 1;
}
// The AutoFunctionsServiceStopAutoFunctionRequest class.
message AutoFunctionsServiceStopAutoFunctionRequest {
}
// The IAutoFunctionsService interface.
service AutoFunctionsService {
   // Call to run a auto brightness-contrast procedure with given settings.
   rpc RunAutoBrightnessContrast (AutoFunctionsServiceRunAutoBrightnessContrastRequest) returns (AutoFunctionServiceRunAutoBrightnessContrastResponse);
   // Call to run a coarse autofocus procedure with given settings.
   rpc RunAutoFocusCoarse (AutoFunctionsServiceRunAutoFocusCoarseRequest) returns (AutoFunctionServiceRunAutoFocusCoarseResponse);
   // Call to run a fine autofocus procedure with given settings.
   rpc RunAutoFocusFine (AutoFunctionsServiceRunAutoFocusFineRequest) returns (AutoFunctionServiceRunAutoFocusFineResponse);
   // Call to run a coarse autostig procedure with given settings.
   rpc RunAutoStigCoarse (AutoFunctionsServiceRunAutoStigCoarseRequest) returns (AutoFunctionServiceRunAutoStigCoarseResponse);
   // Call to run a fine autostig procedure with given settings.
   rpc RunAutoStigFine (AutoFunctionsServiceRunAutoStigFineRequest) returns (AutoFunctionServiceRunAutoStigFineResponse);
   // Call to run a autowobble procedure with given settings.
   rpc RunAutoWobble (AutoFunctionsServiceRunAutoWobbleRequest) returns (AutoFunctionServiceRunAutoWobbleResponse);
   // This stops an ongoing auto function procedure.
   rpc StopAutoFunction (AutoFunctionsServiceStopAutoFunctionRequest) returns (AutoFunctionServiceStopAutoFunctionResponse);
}
