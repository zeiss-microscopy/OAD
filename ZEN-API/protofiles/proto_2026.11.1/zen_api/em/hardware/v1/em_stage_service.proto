syntax = "proto3";
package zen_api.em.hardware.v1;
import "zen_api/em/hardware/v1/stage_backlash_mode.proto";
import "zen_api/hardware/v1/axis_identifier.proto";

// The EmStageServiceGetAxisBacklashModeRequest class.
message EmStageServiceGetAxisBacklashModeRequest {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis_id = 1;
}
// The EmStageServiceGetAxisLimitsRequest class.
message EmStageServiceGetAxisLimitsRequest {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis_id = 1;
}
// The EmStageServiceGetAxisUserLimitsRequest class.
message EmStageServiceGetAxisUserLimitsRequest {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis_id = 1;
}
// The EmStageServiceGetAxisVelocityLimitsRequest class.
message EmStageServiceGetAxisVelocityLimitsRequest {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis_id = 1;
}
// The EmStageServiceGetStageBacklashModesRequest class.
message EmStageServiceGetStageBacklashModesRequest {
}
// The EmStageServiceGetStageFastRequest class.
message EmStageServiceGetStageFastRequest {
}
// The EmStageServiceGetStageLimitsRequest class.
message EmStageServiceGetStageLimitsRequest {
}
// The EmStageServiceGetStageUserLimitsRequest class.
message EmStageServiceGetStageUserLimitsRequest {
}
// The EmStageServiceGetStageVelocityLimitsRequest class.
message EmStageServiceGetStageVelocityLimitsRequest {
}
// The EmStageServiceSetAxisBacklashModeRequest class.
message EmStageServiceSetAxisBacklashModeRequest {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis_id = 1;
   // The backlash mode to set.
   StageBacklashMode mode = 2;
}
// The EmStageServiceSetAxisUserLimitsRequest class.
message EmStageServiceSetAxisUserLimitsRequest {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis_id = 1;
   // The lower User limit in meters. Range [-1.0 : 1.0 m]
   double lower_limit = 2;
   // The upper User limit in meters. Range [-1.0 : 1.0 m]
   double upper_limit = 3;
}
// The EmStageServiceSetAxisVelocityRequest class.
message EmStageServiceSetAxisVelocityRequest {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis_id = 1;
   // The target velocity in meters per second or radians per second.
   double velocity = 2;
}
// The EmStageServiceSetStageBacklashModesRequest class.
message EmStageServiceSetStageBacklashModesRequest {
   // Array of axis backlash modes to set.
   repeated StageServiceAxisBacklashModeResponse axis_backlash_modes = 1;
}
// The EmStageServiceSetStageFastRequest class.
message EmStageServiceSetStageFastRequest {
   // The new stage fast status.
   bool stage_fast = 1;
}
// The EmStageServiceSetStageUserLimitsRequest class.
message EmStageServiceSetStageUserLimitsRequest {
   // Array of axis User limits to set.
   repeated StageServiceAxisUserLimitsResponse axis_user_limits = 1;
}
// Request object for setting axis backlash mode.
message StageServiceAxisBacklashModeResponse {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis = 1;
   // The backlash mode.
   StageBacklashMode mode = 2;
}
// Request object for setting axis soft limits.
message StageServiceAxisUserLimitsResponse {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis = 1;
   // The lower soft limit in meters or radians.
   double lower_limit = 2;
   // The upper soft limit in meters or radians.
   double upper_limit = 3;
}
// Response object for axis backlash mode.
message StageServiceGetAxisBacklashModeResponse {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis = 1;
   // The backlash mode.
   StageBacklashMode mode = 2;
}
// Response object for axis position limits.
message StageServiceGetAxisLimitsResponse {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis = 1;
   // The minimum position in meters or radians.
   double minimum = 2;
   // The maximum position in meters or radians.
   double maximum = 3;
}
// Response object for axis soft limits.
message StageServiceGetAxisUserLimitsResponse {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis = 1;
   // The lower soft limit in meters or radians.
   double lower_limit = 2;
   // The upper soft limit in meters or radians.
   double upper_limit = 3;
}
// Response object for axis velocity limits.
message StageServiceGetAxisVelocityLimitsResponse {
   // The axis identifier.
   .zen_api.hardware.v1.AxisIdentifier axis = 1;
   // The minimum velocity in meters per second or radians per second.
   double minimum = 2;
   // The maximum velocity in meters per second or radians per second.
   double maximum = 3;
}
// Response object for stage backlash modes.
message StageServiceGetStageBacklashModesResponse {
   // The available axes and their backlash modes.
   repeated StageServiceGetAxisBacklashModeResponse axis_backlash_modes = 1;
}
// Response object representing the column focus.
message StageServiceGetStageFastResponse {
   // A value indicating whether stage fast is enabled.
   bool stage_fast = 1;
}
// Response object for stage position limits.
message StageServiceGetStageLimitsResponse {
   // The available axes and their position limits.
   repeated StageServiceGetAxisLimitsResponse axis_limits = 1;
}
// Response object for stage soft limits.
message StageServiceGetStageUserLimitsResponse {
   // The available axes and their soft limits.
   repeated StageServiceGetAxisUserLimitsResponse axis_soft_limits = 1;
}
// Response object for stage velocity limits.
message StageServiceGetStageVelocityLimitsResponse {
   // The available axes and their velocity limits.
   repeated StageServiceGetAxisVelocityLimitsResponse axis_velocity_limits = 1;
}
// Response object for setting axis backlash mode.
message StageServiceSetAxisBacklashModeResponse {
   // A value indicating whether the operation succeeded.
   bool success = 1;
}
// Response object for setting axis soft limits.
message StageServiceSetAxisUserLimitsResponse {
   // A value indicating whether the operation succeeded.
   bool success = 1;
}
// Response object for setting axis velocity.
message StageServiceSetAxisVelocityResponse {
   // A value indicating whether the operation succeeded.
   bool success = 1;
}
// Response object for setting stage backlash modes.
message StageServiceSetStageBacklashModesResponse {
   // A value indicating whether the operation succeeded.
   bool success = 1;
}
// Response object representing the column focus.
message StageServiceSetStageFastResponse {
   // A value indicating whether the stage fast status as a boolean.
   bool stage_fast = 1;
}
// Response object for setting stage user limits.
message StageServiceSetStageUserLimitsResponse {
   // A value indicating whether the operation succeeded.
   bool success = 1;
}
// The IEmStageService interface.
service EmStageService {
   // Gets the backlash mode for a specific stage axis.
   rpc GetAxisBacklashMode (EmStageServiceGetAxisBacklashModeRequest) returns (StageServiceGetAxisBacklashModeResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Gets the position limits (minimum and maximum) for a specific stage axis.
   rpc GetAxisLimits (EmStageServiceGetAxisLimitsRequest) returns (StageServiceGetAxisLimitsResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Gets the User limits (upper and lower) for a specific stage axis.
   rpc GetAxisUserLimits (EmStageServiceGetAxisUserLimitsRequest) returns (StageServiceGetAxisUserLimitsResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Gets the velocity limits (minimum and maximum) for a specific stage axis.
   rpc GetAxisVelocityLimits (EmStageServiceGetAxisVelocityLimitsRequest) returns (StageServiceGetAxisVelocityLimitsResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Gets the backlash modes for all available stage axes.
   rpc GetStageBacklashModes (EmStageServiceGetStageBacklashModesRequest) returns (StageServiceGetStageBacklashModesResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Gets the stage fast status.
   rpc GetStageFast (EmStageServiceGetStageFastRequest) returns (StageServiceGetStageFastResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Gets the position limits for all available stage axes.
   rpc GetStageLimits (EmStageServiceGetStageLimitsRequest) returns (StageServiceGetStageLimitsResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Gets the User limits for all available stage axes.
   rpc GetStageUserLimits (EmStageServiceGetStageUserLimitsRequest) returns (StageServiceGetStageUserLimitsResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Gets the velocity limits for all available stage axes.
   rpc GetStageVelocityLimits (EmStageServiceGetStageVelocityLimitsRequest) returns (StageServiceGetStageVelocityLimitsResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Sets the backlash mode for a specific stage axis.
   rpc SetAxisBacklashMode (EmStageServiceSetAxisBacklashModeRequest) returns (StageServiceSetAxisBacklashModeResponse);
   // Sets the User limits for a specific stage axis.
   rpc SetAxisUserLimits (EmStageServiceSetAxisUserLimitsRequest) returns (StageServiceSetAxisUserLimitsResponse);
   // Sets the target velocity for a specific stage axis.
   rpc SetAxisVelocity (EmStageServiceSetAxisVelocityRequest) returns (StageServiceSetAxisVelocityResponse);
   // Sets the backlash modes for multiple stage axes.
   rpc SetStageBacklashModes (EmStageServiceSetStageBacklashModesRequest) returns (StageServiceSetStageBacklashModesResponse);
   // Applies a new stage fast status.
   rpc SetStageFast (EmStageServiceSetStageFastRequest) returns (StageServiceSetStageFastResponse);
   // Sets the User limits for multiple stage axes.
   rpc SetStageUserLimits (EmStageServiceSetStageUserLimitsRequest) returns (StageServiceSetStageUserLimitsResponse);
}
