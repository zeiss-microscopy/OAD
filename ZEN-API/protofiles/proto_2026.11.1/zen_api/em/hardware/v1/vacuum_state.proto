syntax = "proto3";
package zen_api.em.hardware.v1;

// Possible states of the vacuum system.
enum VacuumState {
   // Default enum value.
   VACUUM_STATE_UNSPECIFIED = 0;
   // Vacuum is ready.
   VACUUM_STATE_READY = 1;
   // Vacuum is not ready.
   // Maybe vented, pumping, venting, ...
   VACUUM_STATE_NOT_READY = 2;
}
