syntax = "proto3";
package zen_api.em.workflow.v1;
import "zen_api/em/workflow/v1/eds_acquisition_mode.proto";

// EDS spectrum acquisition setting.
message EdsSpectrumAcquisitionSettings {
   // The acquisition counts.
   int32 acquisition_counts = 1;
   // The acquisition time in seconds.
   double acquisition_time = 2;
   // A value indicating whether the acquisition mode (live time or counts).
   EdsAcquisitionMode acquisition_mode = 3;
}
