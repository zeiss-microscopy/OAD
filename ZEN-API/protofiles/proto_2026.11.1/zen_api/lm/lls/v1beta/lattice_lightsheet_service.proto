syntax = "proto3";
package zen_api.lm.lls.v1beta;
import "google/protobuf/wrappers.proto";
import "zen_api/common/v1/double_point.proto";

// The response for the find cover glass ZenAPI call.
message FindCoverGlassResponse {
   // A value indicating whether the api call was successful.
   bool success = 1;
   // The message describing the result.
   string message = 2;
}
// The response of the homing operation.
message HomingResponse {
}
// The LatticeLightsheetServiceFindCoverGlassRequest class.
message LatticeLightsheetServiceFindCoverGlassRequest {
   // The focus sheet position.
   double focus_sheet = 1;
}
// The LatticeLightsheetServiceHomingRequest class.
message LatticeLightsheetServiceHomingRequest {
   // Optional total timeout of the operation. Unit: seconds. When not provided, a default timeout applies.
   .google.protobuf.Int32Value timeout = 1;
}
// The LatticeLightsheetServiceRecallFocusRequest class.
message LatticeLightsheetServiceRecallFocusRequest {
   // The focus sheet position.
   double focus_sheet = 1;
   // The refocus position.
   int32 focus_waist = 2;
   // A value indicating whether the extended range should be used.
   bool use_extended_range = 3;
   // The extended range value.
   double extended_range = 4;
}
// The response for the refocus ZenAPI call.
message LatticeLightsheetServiceRecallFocusResponse {
   // A value indicating whether the api call was successful.
   bool success = 1;
   // The message describing the result. In case of success, this will be empty. In case of failure, this will contain an error message why the operation failed.
   string message = 2;
}
// The LatticeLightsheetServiceRunTiltCorrectionRequest class.
message LatticeLightsheetServiceRunTiltCorrectionRequest {
   // The reference points.
   repeated .zen_api.common.v1.DoublePoint reference_points = 1;
   // The focus sheet position.
   double focus_sheet = 2;
}
// The response for the global tilt correction ZenAPI call.
message LatticeLightsheetServiceRunTiltCorrectionResponse {
   // A value indicating whether the api call was successful.
   bool success = 1;
   // The message describing the result. In case of success, this will be empty. In case of failure, this will contain an error message why the operation failed.
   string message = 2;
}
// The LatticeLightsheetServiceStoreFocusForAutoFocusRequest class.
message LatticeLightsheetServiceStoreFocusForAutoFocusRequest {
   // The experiment id.
   string experiment_id = 1;
}
// The response for store focus for auto-focus operation.
message LatticeLightsheetServiceStoreFocusForAutoFocusResponse {
   // A value indicating whether the store focus operation was successful.
   bool success = 1;
   // The message describing the result. In case of success, this will be empty. In case of failure, this will contain an error message why the operation failed.
   string message = 2;
}
// The LatticeLightsheetServiceStoreFocusRequest class.
message LatticeLightsheetServiceStoreFocusRequest {
   // The focus sheet position.
   double focus_sheet = 1;
   // The focus waist position.
   int32 focus_waist = 2;
}
// The response for store focus.
message LatticeLightsheetServiceStoreFocusResponse {
   // A value indicating whether the store focus operation was successful.
   bool success = 1;
   // The message describing the result. In case of success, this will be empty. In case of failure, this will contain an error message why the operation failed.
   string message = 2;
}
// The ILatticeLightsheetService interface.
service LatticeLightsheetService {
   // Finds the cover glass asynchronously.
   // This is done by searching the z range and looking for a peak in the signal using a two-step coarse and a fine search.
   rpc FindCoverGlass (LatticeLightsheetServiceFindCoverGlassRequest) returns (FindCoverGlassResponse);
   // Performs the homing operation.
   rpc Homing (LatticeLightsheetServiceHomingRequest) returns (HomingResponse);
   // Refocuses the cover glass.
   // It is mandatory to store a focus position before calling this method.
   rpc RecallFocus (LatticeLightsheetServiceRecallFocusRequest) returns (LatticeLightsheetServiceRecallFocusResponse);
   // Runs the tilt correction and sets the corrected values.
   // At least 3 points are expected to run the correction.
   rpc RunTiltCorrection (LatticeLightsheetServiceRunTiltCorrectionRequest) returns (LatticeLightsheetServiceRunTiltCorrectionResponse);
   // Stores the current focus position.
   // This position is e.g. used by RecallFocus to refocus on this position.
   rpc StoreFocus (LatticeLightsheetServiceStoreFocusRequest) returns (LatticeLightsheetServiceStoreFocusResponse);
   // Stores the current focus position.
   // This position is e.g. used by RecallFocus to refocus on this position.
   // The focus sheet and focus waist parameters are taken from the given experiment.
   // Additionally, stores the focus position for the autofocus configured in the experiment.
   // Requires that a cover glass refocus is selected in the autofocus.
   rpc StoreFocusForAutoFocus (LatticeLightsheetServiceStoreFocusForAutoFocusRequest) returns (LatticeLightsheetServiceStoreFocusForAutoFocusResponse);
}
