}
// The CameraServiceRegisterOnAcquisitionStatusChangedRequest class.
message CameraServiceRegisterOnAcquisitionStatusChangedRequest {
   // The camera ID.
   string camera_id = 1;
}
// Response object for the get acquisition state.
message CameraServiceRegisterOnAcquisitionStatusChangedResponse {
