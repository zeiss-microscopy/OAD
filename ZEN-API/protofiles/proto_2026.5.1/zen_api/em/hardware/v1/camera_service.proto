}
// Response object for the get CCD mode.
message CameraServiceRegisterOnCcdModeChangedResponse {
   // The CCD mode.
   CcdMode mode = 1;
   // A string message for display to the customer in failure case. This is only for display purpose and the message may change.
   // Empty string on success.
   string message = 2;
}
// The CameraServiceRegisterOnContrastChangedRequest class.
message CameraServiceRegisterOnContrastChangedRequest {
   // The camera ID.
   string camera_id = 1;
}
// Response object for the get contrast.
message CameraServiceRegisterOnContrastChangedResponse {
   // The contrast.
   double contrast = 1;
   // A string message for display to the customer in failure case. This is only for display purpose and the message may change.
