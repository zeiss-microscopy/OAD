syntax = "proto3";
package zen_api.em.hardware.v1;
import "zen_api/em/hardware/v1/acquisition_response_type.proto";
import "zen_api/em/hardware/v1/camera_acquisition_settings.proto";
import "zen_api/em/hardware/v1/camera_acquisition_status.proto";
import "zen_api/em/hardware/v1/ccd_mode.proto";

// The CameraServiceGetAcquisitionStatusRequest class.
message CameraServiceGetAcquisitionStatusRequest {
   // The camera ID.
   string camera_id = 1;
}
// Response object for the get acquisition state.
message CameraServiceGetAcquisitionStatusResponse {
   // The acquisition status.
   CameraAcquisitionStatus status = 1;
   // A string message for display to the customer in failure case. This is only for display purpose and the message may change.
   // Empty string on success.
   string message = 2;
}
// The CameraServiceGetAvailableCamerasRequest class.
message CameraServiceGetAvailableCamerasRequest {
}
// Response object representing a list of available cameras.
message CameraServiceGetAvailableCamerasResponse {
   // The available cameras on the system.
   repeated string camera_names = 1;
}
// The CameraServiceGetBrightnessRequest class.
message CameraServiceGetBrightnessRequest {
   // The camera ID.
   string camera_id = 1;
}
// Response object for the get brightness.
message CameraServiceGetBrightnessResponse {
   // The brightness.
   double brightness = 1;
   // A string message for display to the customer in failure case. This is only for display purpose and the message may change.
   // Empty string on success.
   string message = 2;
}
// The CameraServiceGetCcdModeRequest class.
message CameraServiceGetCcdModeRequest {
   // The camera ID.
   string camera_id = 1;
}
// Response object for the get CCD mode.
message CameraServiceGetCcdModeResponse {
