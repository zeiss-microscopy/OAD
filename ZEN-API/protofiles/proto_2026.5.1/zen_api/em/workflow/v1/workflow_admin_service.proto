syntax = "proto3";
package zen_api.em.workflow.v1;

// The WorkflowAdminServiceDeleteWorkflowByIdRequest class.
message WorkflowAdminServiceDeleteWorkflowByIdRequest {
   // Identifier of the workflow which should be deleted.
   string workflow_id = 1;
}
// The WorkflowAdminServiceDeleteWorkflowByIdResponse class.
message WorkflowAdminServiceDeleteWorkflowByIdResponse {
}
// The WorkflowAdminServiceGetAvailableWorkflowIdsRequest class.
message WorkflowAdminServiceGetAvailableWorkflowIdsRequest {
}
// Response object of the GetAvailableWorkflowsIds method.
message WorkflowAdminServiceGetAvailableWorkflowIdsResponse {
   // A value with workflow xml.
   repeated string workflow_ids = 1;
}
// The IWorkflowAdminService interface.
service WorkflowAdminService {
   // Delete specified workflow by workflowId.
   rpc DeleteWorkflowById (WorkflowAdminServiceDeleteWorkflowByIdRequest) returns (WorkflowAdminServiceDeleteWorkflowByIdResponse);
   // Gets all available workflowIds.
   rpc GetAvailableWorkflowIds (WorkflowAdminServiceGetAvailableWorkflowIdsRequest) returns (WorkflowAdminServiceGetAvailableWorkflowIdsResponse);
}
