syntax = "proto3";
package zen_api.lm.acquisition.v1;

// Represents a two-dimensional point with X and Y coordinates for use in region-based acquisition scenarios.
message RegionPoint {
   // The X coordinate of the point.
   double x = 1;
   // The Y coordinate of the point.
   double y = 2;
}
