syntax = "proto3";
package zen_api.lm.acquisition.v1;

// Extended time units to match TimeUnitExtended enum.
enum TimeUnitExtended {
   // Unspecified.
   TIME_UNIT_EXTENDED_UNSPECIFIED = 0;
   // Cycles is the count of time points.
   TIME_UNIT_EXTENDED_CYCLES = 1;
   // Time unit milliseconds.
   TIME_UNIT_EXTENDED_MS = 2;
   // Time unit seconds.
   TIME_UNIT_EXTENDED_S = 3;
   // Time unit minutes.
   TIME_UNIT_EXTENDED_MIN = 4;
   // Time unit hours.
   TIME_UNIT_EXTENDED_H = 5;
   // Time unit days.
   TIME_UNIT_EXTENDED_DAYS = 6;
}
