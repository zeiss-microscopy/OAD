syntax = "proto3";
package zen_api.lm.hardware.v2;
import "zen_api/common/v1/double_frame.proto";

// Describes the info needed to set a camera.
message SetCameraData {
   // The Id.
   string id = 1;
   // The ExposureTime.
   double exposure_time = 2;
   // The Binning.
   int32 binning = 3;
   // The Frame.
   .zen_api.common.v1.DoubleFrame frame = 10;
}
