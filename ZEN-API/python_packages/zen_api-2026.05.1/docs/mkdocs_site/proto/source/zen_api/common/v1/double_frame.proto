syntax = "proto3";
package zen_api.common.v1;
import "zen_api/common/v1/double_point.proto";
import "zen_api/common/v1/double_size.proto";

// Double-based frame.
message DoubleFrame {
   // The start point.
   DoublePoint start_point = 1;
   // The size.
   DoubleSize size = 2;
}
