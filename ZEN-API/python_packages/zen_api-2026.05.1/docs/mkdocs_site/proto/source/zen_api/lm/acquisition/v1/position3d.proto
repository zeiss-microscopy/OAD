syntax = "proto3";
package zen_api.lm.acquisition.v1;

// A position in three dimensions (XYZ).
message Position3d {
   // The X position (unit: m).
   double x = 1;
   // The Y position (unit: m).
   double y = 2;
   // The Z position (unit: m).
   double z = 3;
}
