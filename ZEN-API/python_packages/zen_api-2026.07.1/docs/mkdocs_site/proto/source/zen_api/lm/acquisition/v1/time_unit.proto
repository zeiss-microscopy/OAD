syntax = "proto3";
package zen_api.lm.acquisition.v1;

// Extended time units to match TimeUnit enum.
enum TimeUnit {
   // Unspecified.
   TIME_UNIT_UNSPECIFIED = 0;
   // Time unit milliseconds.
   TIME_UNIT_MS = 1;
   // Time unit seconds.
   TIME_UNIT_S = 2;
   // Time unit minutes.
   TIME_UNIT_MIN = 3;
   // Time unit hours.
   TIME_UNIT_H = 4;
   // Time unit days.
   TIME_UNIT_DAYS = 5;
}
