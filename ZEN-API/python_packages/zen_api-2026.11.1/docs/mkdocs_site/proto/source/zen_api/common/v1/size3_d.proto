syntax = "proto3";
package zen_api.common.v1;

// The extent in the three-dimensional space.
message Size3D {
   // The X size (unit: m).
   double width = 1;
   // The Y size (unit: m).
   double height = 2;
   // The Z size (unit: m).
   double depth = 3;
}
