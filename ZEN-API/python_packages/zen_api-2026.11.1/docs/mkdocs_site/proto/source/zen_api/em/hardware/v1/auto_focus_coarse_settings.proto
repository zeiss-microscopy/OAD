syntax = "proto3";
package zen_api.em.hardware.v1;

// Request object to set the autofocus coarse settings.
message AutoFocusCoarseSettings {
   // The detector to use.
   // Null will take the detector from the previous acquisition.
   string detector_name = 1;
   // The minimal focus search range in mm.
   double focus_range_min = 2;
   // The maximal focus search range in mm.
   double focus_range_max = 3;
   // The dwell time in seconds.
   // The closest dwell time to the selected one will be chosen.
   double dwell_time = 4;
   // A value indicating whether to check the detectors brightness constrast settings during autofocus coarse.
   bool check_bc = 5;
   // The lower magnification step for autofocus coarse.
   int32 lower_mag_step = 6;
   // The upper magnification step for autofocus coarse.
   int32 upper_mag_step = 7;
}
