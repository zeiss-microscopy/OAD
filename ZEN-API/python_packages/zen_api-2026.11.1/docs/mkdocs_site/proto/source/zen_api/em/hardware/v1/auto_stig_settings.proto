syntax = "proto3";
package zen_api.em.hardware.v1;

// Request object to set the autostig settings.
message AutoStigSettings {
   // The detector to use.
   // Null will take the detector from the previous acquisition.
   string detector_name = 1;
   // The dwell time in seconds.
   // The closest dwell time to the selected one will be chosen.
   double dwell_time = 2;
   // A value indicating whether to check the detectors brightness contrast settings during autostig.
   bool check_bc = 3;
   // A value indicating whether the feature finder is active during autostig.
   bool feature_finder_active = 4;
}
