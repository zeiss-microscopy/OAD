syntax = "proto3";
package zen_api.em.hardware.v1;

// Request object to set the autowobble settings.
message AutoWobbleSettings {
   // The detector to use.
   // Null will take the detector from the previous acquisition.
   string detector_name = 1;
   // The dwell time in seconds.
   // The closest dwell time to the selected one will be chosen.
   double dwell_time = 2;
   // The type of parameter that is used for the wobbling.
   // Either "EHT" or "Objective".
   string wobble_type = 3;
   // A value indicating the amplification applied to the wobbled parameter.
   // Given in percent.
   double wobble_amplitude = 4;
   // A value indicating the magnification at which autowobble is run.
   // Setting TargetMagnification = 0 ensures that the autowobble is run at the current magnification.
   int32 target_magnification = 5;
   // A value indicating whether to check the detectors brightness contrast settings during autowobble.
   bool check_bc = 6;
   // A value indicating whether the feature finder is active during autowobble.
   bool feature_finder_active = 7;
}
