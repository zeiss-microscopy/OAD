syntax = "proto3";
package zen_api.em.hardware.v1;

message CameraAcquisitionSettings {
   // The camera to use.
   string camera_name = 1;
   // The image width in pixels.
   int32 width = 2;
   // The image height in pixels.
   int32 height = 3;
}
