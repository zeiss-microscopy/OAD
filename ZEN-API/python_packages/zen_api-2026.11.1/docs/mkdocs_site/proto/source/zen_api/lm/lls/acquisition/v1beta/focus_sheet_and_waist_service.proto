syntax = "proto3";
package zen_api.lm.lls.acquisition.v1beta;

// The FocusSheetAndWaistServiceGetFocusSheetRequest class.
message FocusSheetAndWaistServiceGetFocusSheetRequest {
   // The id that references the experiment.
   string experiment_id = 1;
}
// Response containing the Lattice Lightsheet focus sheet position.
message FocusSheetAndWaistServiceGetFocusSheetResponse {
   // The focus sheet position, range [-1, 1].
   double focus_sheet = 1;
}
// The FocusSheetAndWaistServiceGetFocusWaistRequest class.
message FocusSheetAndWaistServiceGetFocusWaistRequest {
   // The id that references the experiment.
   string experiment_id = 1;
}
// Response containing the Lattice Lightsheet focus waist.
message FocusSheetAndWaistServiceGetFocusWaistResponse {
   // The refocus device position, range [0, 100].
   int32 focus_waist_position = 1;
}
// The FocusSheetAndWaistServiceRunFocusSheetAndWaistRequest class.
message FocusSheetAndWaistServiceRunFocusSheetAndWaistRequest {
   // The id that references the experiment.
   string experiment_id = 1;
}
// The response for the focus sheet and waist ZenAPI call.
message FocusSheetAndWaistServiceRunFocusSheetAndWaistResponse {
   // A value indicating whether the api call was successful.
   bool success = 1;
   // The message describing the result. In case of success, this will be empty. In case of failure, this will contain an error message why the operation failed.
   string message = 2;
}
// The FocusSheetAndWaistServiceSetFocusSheetRequest class.
message FocusSheetAndWaistServiceSetFocusSheetRequest {
   // The id that references the experiment.
   string experiment_id = 1;
   // The position, range [-1, 1].
   double focus_sheet = 2;
}
// The response for the SetFocusSheet operation.
message FocusSheetAndWaistServiceSetFocusSheetResponse {
}
// The FocusSheetAndWaistServiceSetFocusWaistRequest class.
message FocusSheetAndWaistServiceSetFocusWaistRequest {
   // The id that references the experiment.
   string experiment_id = 1;
   // The focus waist, range [0, 100].
   int32 focus_waist = 2;
}
// The FocusSheetAndWaistServiceSetFocusWaistResponse class.
message FocusSheetAndWaistServiceSetFocusWaistResponse {
}
// The IFocusSheetAndWaistService interface.
service FocusSheetAndWaistService {
   // Gets the focus sheet position.
   rpc GetFocusSheet (FocusSheetAndWaistServiceGetFocusSheetRequest) returns (FocusSheetAndWaistServiceGetFocusSheetResponse);
   // Gets the lightsheet focus waist.
   rpc GetFocusWaist (FocusSheetAndWaistServiceGetFocusWaistRequest) returns (FocusSheetAndWaistServiceGetFocusWaistResponse);
   // Runs the focus sheet and waist calibrations with the experiment.
   // Use the ExperimentService to load the experiment and get its guid.
   rpc RunFocusSheetAndWaist (FocusSheetAndWaistServiceRunFocusSheetAndWaistRequest) returns (FocusSheetAndWaistServiceRunFocusSheetAndWaistResponse);
   // Sets the focus sheet position.
   rpc SetFocusSheet (FocusSheetAndWaistServiceSetFocusSheetRequest) returns (FocusSheetAndWaistServiceSetFocusSheetResponse);
   // Sets the lightsheet focus waist.
   rpc SetFocusWaist (FocusSheetAndWaistServiceSetFocusWaistRequest) returns (FocusSheetAndWaistServiceSetFocusWaistResponse);
}
