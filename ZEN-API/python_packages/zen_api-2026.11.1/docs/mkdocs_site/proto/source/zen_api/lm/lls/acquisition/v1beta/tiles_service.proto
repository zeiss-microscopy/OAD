syntax = "proto3";
package zen_api.lm.lls.acquisition.v1beta;
import "zen_api/common/v1/double_point.proto";
import "zen_api/common/v1/double_size.proto";
import "zen_api/common/v1/point3_d.proto";
import "zen_api/common/v1/region3_d.proto";
import "zen_api/common/v1/size3_d.proto";

// The TilesServiceAdd3DRectangleTileRegionRequest class.
message TilesServiceAdd3DRectangleTileRegionRequest {
   // The experiment id referencing the experiment to which the regions will be added.
   string experiment_id = 1;
   // The center of the tile region.
   .zen_api.common.v1.Point3D center = 2;
   // The desired size of the tile region.
   .zen_api.common.v1.Size3D size = 3;
   // A value indicating whether to extend the region for full Z reconstruction.
   bool full_z = 4;
}
// The response of the Add3DRectangleTileRegion method, containing information about the created tile regions.
message TilesServiceAdd3DRectangleTileRegionResponse {
   // The created regions.
   repeated .zen_api.common.v1.Region3D regions = 1;
}
// The TilesServiceAddRectangleTileRegionRequest class.
message TilesServiceAddRectangleTileRegionRequest {
   // The experiment id referencing the experiment to which the region will be added.
   string experiment_id = 1;
   // The center of the tile region in m.
   .zen_api.common.v1.DoublePoint center = 2;
   // The desired size of the tile region in m.
   .zen_api.common.v1.DoubleSize size = 3;
   // The z position of the tile region in m.
   double z = 4;
   // A value indicating whether the region should be adjusted to acquire full information in the z dimension.
   bool full_z = 5;
}
// The response of the AddRectangleTileRegion method, containing information about the created tile region.
message TilesServiceAddRectangleTileRegionResponse {
   // The center of the created tile region.
   .zen_api.common.v1.DoublePoint center = 1;
   // The size of the created tile region.
   .zen_api.common.v1.DoubleSize size = 2;
   // The z position of the tile region.
   double z = 3;
}
// The TilesServiceGetCenterOfSampleHolderWellRequest class.
message TilesServiceGetCenterOfSampleHolderWellRequest {
   // The id that references the experiment.
   string experiment_id = 1;
   // The row index of the well.
   int32 row_index = 2;
   // The column index of the well.
   int32 column_index = 3;
}
// The response of the GetCenterOfSampleHolderWell operation.
message TilesServiceGetCenterOfSampleHolderWellResponse {
   // The center of the sample holder well.
   .zen_api.common.v1.DoublePoint center = 1;
}
// The ITilesService interface.
service TilesService {
   // Adds one or more rectangle tile regions to the experiment, stacked in Z for spanning the requested Z depth.
   // The volumes overlap in Z by 50 pixels.
   // If fullZ is false (default), the volume has sparse data at the sides, reconstructed Z slices do not span the
   // whole width.
   // If fullZ is true, the width is extended for full Z reconstruction.
   rpc Add3DRectangleTileRegion (TilesServiceAdd3DRectangleTileRegionRequest) returns (TilesServiceAdd3DRectangleTileRegionResponse);
   // Adds a rectangle tile region to the experiment referenced by the experiment id.
   // If the fullZ parameter is set the region width is extended to contain full data in z dimension.
   // Otherwise, a default rectangle region is added.
   rpc AddRectangleTileRegion (TilesServiceAddRectangleTileRegionRequest) returns (TilesServiceAddRectangleTileRegionResponse);
   // Gets the center of the sample holder well for the given row and column index.
   rpc GetCenterOfSampleHolderWell (TilesServiceGetCenterOfSampleHolderWellRequest) returns (TilesServiceGetCenterOfSampleHolderWellResponse);
}
