syntax = "proto3";
package zen_api.em.hardware.v1;

// The SpecimenCurrentMonitorServiceGetSpecimenCurrentRequest class.
message SpecimenCurrentMonitorServiceGetSpecimenCurrentRequest {
}
// Response object for specimen current.
message SpecimenCurrentMonitorServiceGetSpecimenCurrentResponse {
   // The specimen current value in amperes.
   double current = 1;
}
// The SpecimenCurrentMonitorServiceRegisterOnSpecimenCurrentChangedRequest class.
message SpecimenCurrentMonitorServiceRegisterOnSpecimenCurrentChangedRequest {
}
// Response object for specimen current changed notification.
message SpecimenCurrentMonitorServiceRegisterOnSpecimenCurrentChangedResponse {
   // The specimen current value in amperes.
   double current = 1;
}
// The ISpecimenCurrentMonitorService interface.
service SpecimenCurrentMonitorService {
   // Gets the current specimen current in amperes.
   rpc GetSpecimenCurrent (SpecimenCurrentMonitorServiceGetSpecimenCurrentRequest) returns (SpecimenCurrentMonitorServiceGetSpecimenCurrentResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Register on specimen current changed events.
   rpc RegisterOnSpecimenCurrentChanged (SpecimenCurrentMonitorServiceRegisterOnSpecimenCurrentChangedRequest) returns (stream SpecimenCurrentMonitorServiceRegisterOnSpecimenCurrentChangedResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
}
