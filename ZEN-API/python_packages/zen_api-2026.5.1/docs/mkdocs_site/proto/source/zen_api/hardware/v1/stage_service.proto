syntax = "proto3";
package zen_api.hardware.v1;
import "zen_api/hardware/v1/axis_identifier.proto";
import "zen_api/hardware/v1/stage_axis.proto";
import "zen_api/hardware/v1/stage_motion_state.proto";
import "zen_api/hardware/v1/stage_state.proto";

// Abstract representation of an arbitrary axis and it's velocity.
message StageServiceAxisVelocityResponse {
   // The axis identifier.
   AxisIdentifier axis = 1;
   // The velocity of the axis in meters per second or radians per second.
   double velocity = 2;
}
// The StageServiceGetAvailableStageAxisRequest class.
message StageServiceGetAvailableStageAxisRequest {
}
// Response object of available stage axis.
message StageServiceGetAvailableStageAxisResponse {
   repeated AxisIdentifier available_axis = 1 [packed = false];
}
// The StageServiceGetAxisPositionRequest class.
message StageServiceGetAxisPositionRequest {
   // The requested axis.
   AxisIdentifier axis_id = 1;
}
// Abstract representation of an arbitrary axis.
message StageServiceGetAxisPositionResponse {
   // The axis identifier.
   AxisIdentifier axis = 1;
   // The position of the axis in meters or radians.
   double position = 2;
}
// The StageServiceGetAxisVelocityRequest class.
message StageServiceGetAxisVelocityRequest {
   // The requested axis.
   AxisIdentifier axis_id = 1;
}
// Abstract representation of an arbitrary axis and it's velocity.
message StageServiceGetAxisVelocityResponse {
   // The axis identifier.
   AxisIdentifier axis = 1;
   // The velocity of the axis in meters per second or radians per second.
   double velocity = 2;
}
// The StageServiceGetStageMotionStateRequest class.
message StageServiceGetStageMotionStateRequest {
}
// StageMotionState enum response.
message StageServiceGetStageMotionStateResponse {
   // The available axis and their positions.
   StageMotionState state = 1;
}
// The StageServiceGetStagePositionRequest class.
message StageServiceGetStagePositionRequest {
}
// Response object of stage axis positions.
message StageServiceGetStagePositionResponse {
   // The available axis and their positions.
   repeated StageAxis axis_positions = 1;
}
// The StageServiceGetStageStateRequest class.
message StageServiceGetStageStateRequest {
}
// StageState enum response.
message StageServiceGetStageStateResponse {
   // The stage state.
   StageState state = 1;
}
// The StageServiceGetStageVelocityRequest class.
message StageServiceGetStageVelocityRequest {
}
// Response object of stage axis velocities.
message StageServiceGetStageVelocityResponse {
   // The available axis and their velocities.
   repeated StageServiceAxisVelocityResponse axis_velocities = 1;
}
// The StageServiceInitializeStageRequest class.
message StageServiceInitializeStageRequest {
}
// Response object of the initialize stage method.
message StageServiceInitializeStageResponse {
   // A value indicating whether the task to initialize the stage succeeded or not.
   bool task_success = 1;
}
// The StageServiceMoveToRequest class.
message StageServiceMoveToRequest {
   // The stage axis that should move.
   // The position is in meters.
   repeated StageAxis axis_to_move = 1;
}
// Response object of the MoveStage method.
message StageServiceMoveToResponse {
   // A value indicating whether the task to move the stage succeeded or not.
   bool task_success = 1;
}
// The StageServiceRegisterOnStageMotionStateChangedRequest class.
message StageServiceRegisterOnStageMotionStateChangedRequest {
}
// StageMotionState enum response.
message StageServiceRegisterOnStageMotionStateChangedResponse {
   // The stage motion state.
   StageMotionState state = 1;
}
// The StageServiceRegisterOnStagePositionChangedRequest class.
message StageServiceRegisterOnStagePositionChangedRequest {
}
// Abstract representation of an arbitrary axis.
message StageServiceRegisterOnStagePositionChangedResponse {
   // The axis identifier.
   AxisIdentifier axis = 1;
   // The position of the axis in meters or radians.
   double position = 2;
}
// The StageServiceRegisterOnStageStateChangedRequest class.
message StageServiceRegisterOnStageStateChangedRequest {
}
// StageState enum response.
message StageServiceRegisterOnStageStateChangedResponse {
   // The stage state.
   StageState state = 1;
}
// The StageServiceRegisterOnStageVelocityChangedRequest class.
message StageServiceRegisterOnStageVelocityChangedRequest {
}
// Abstract representation of an arbitrary axis and it's velocity.
message StageServiceRegisterOnStageVelocityChangedResponse {
   // The axis identifier.
   AxisIdentifier axis = 1;
   // The velocity of the axis in meters per second or radians per second.
   double velocity = 2;
}
// The StageServiceStopRequest class.
message StageServiceStopRequest {
}
// The StageServiceStopResponse class.
message StageServiceStopResponse {
}
// The IStageService interface.
service StageService {
   // Retrieves all available stage axis on this system.
   rpc GetAvailableStageAxis (StageServiceGetAvailableStageAxisRequest) returns (StageServiceGetAvailableStageAxisResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Gets the current position of an axis of the stage.
   rpc GetAxisPosition (StageServiceGetAxisPositionRequest) returns (StageServiceGetAxisPositionResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Gets the current velocity of an axis of the stage.
   rpc GetAxisVelocity (StageServiceGetAxisVelocityRequest) returns (StageServiceGetAxisVelocityResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Retrieves the current stage motion state.
   rpc GetStageMotionState (StageServiceGetStageMotionStateRequest) returns (StageServiceGetStageMotionStateResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Retrieves the current stage position.
   // This will return the positions of all available axis..
   rpc GetStagePosition (StageServiceGetStagePositionRequest) returns (StageServiceGetStagePositionResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Retrieves the current stage state.
   rpc GetStageState (StageServiceGetStageStateRequest) returns (StageServiceGetStageStateResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Retrieves the current stage velocity.
   // This will return the velocity of all available axis.
   rpc GetStageVelocity (StageServiceGetStageVelocityRequest) returns (StageServiceGetStageVelocityResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Starts an initialization routine for the stage to initialize all stage axis.
   // This may take a while and the stage is moving in this time.
   rpc InitializeStage (StageServiceInitializeStageRequest) returns (StageServiceInitializeStageResponse);
   // Moves the stage.
   rpc MoveTo (StageServiceMoveToRequest) returns (StageServiceMoveToResponse);
   // Notification about changes of the stage motion state.
   rpc RegisterOnStageMotionStateChanged (StageServiceRegisterOnStageMotionStateChangedRequest) returns (stream StageServiceRegisterOnStageMotionStateChangedResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Notification about changes of all stage axis positions.
   rpc RegisterOnStagePositionChanged (StageServiceRegisterOnStagePositionChangedRequest) returns (stream StageServiceRegisterOnStagePositionChangedResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Notification about changes of the stage state.
   rpc RegisterOnStageStateChanged (StageServiceRegisterOnStageStateChangedRequest) returns (stream StageServiceRegisterOnStageStateChangedResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Notification about changes of all stage axis velocities.
   rpc RegisterOnStageVelocityChanged (StageServiceRegisterOnStageVelocityChangedRequest) returns (stream StageServiceRegisterOnStageVelocityChangedResponse)
   {
      option idempotency_level = NO_SIDE_EFFECTS;
   }
   // Immediately stops the stage.
   rpc Stop (StageServiceStopRequest) returns (StageServiceStopResponse);
}
