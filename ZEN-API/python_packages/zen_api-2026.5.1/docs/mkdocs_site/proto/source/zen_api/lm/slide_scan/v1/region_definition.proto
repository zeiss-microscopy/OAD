syntax = "proto3";
package zen_api.lm.slide_scan.v1;
import "zen_api/lm/acquisition/v2/region_contour.proto";

// Represents definition of scan region.
message RegionDefinition {
   // The region contour definition.
   // The type of the contour can be:
   // ZenApi.LM.Acquisition.V2.RegionRectangle, ZenApi.LM.Acquisition.V2.RegionEllipse or ZenApi.LM.Acquisition.V2.RegionPolygon.
   .zen_api.lm.acquisition.v2.RegionContour contour = 1;
}
