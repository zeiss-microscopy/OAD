syntax = "proto3";
package zen_api.lm.slide_scan.v1;

// Numerical result code.
enum ResponseCode {
   // Default value if the status is not specified.
   RESPONSE_CODE_UNSPECIFIED = 0;
   // The required parameter is missing.
   RESPONSE_CODE_INVALID_ARGUMENT = 1;
   // The requested resource could not be found.
   RESPONSE_CODE_NOT_FOUND = 2;
   // The operation is not allowed.
   RESPONSE_CODE_NOT_ALLOWED = 3;
   // The synchronous wait for operation finihsed was cancelled by the user.
   RESPONSE_CODE_CANCELLED = 4;
}
