syntax = "proto3";
package zen_api.em.hardware.v1;

// Possible states of any valve.
enum ValveState {
   // Default enum value.
   VALVE_STATE_UNSPECIFIED = 0;
   // Valve is open.
   VALVE_STATE_OPEN = 1;
   // Valve is closed.
   VALVE_STATE_CLOSED = 2;
}
