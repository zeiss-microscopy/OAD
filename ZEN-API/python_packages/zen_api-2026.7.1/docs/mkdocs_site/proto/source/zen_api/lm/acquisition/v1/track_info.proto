syntax = "proto3";
package zen_api.lm.acquisition.v1;
import "zen_api/lm/acquisition/v1/channel_info.proto";

// Information about a track.
message TrackInfo {
   // A value indicating whether the track is activated.
   bool is_activated = 1;
   // The info for all channels in the track.
   repeated ChannelInfo channels = 2;
}
