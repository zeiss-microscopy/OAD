syntax = "proto3";
package zen_api.lm.hardware.v2;

// Describes a filter.
message FilterData {
   // The name/ id of the filter.
   string name = 1;
   // The id.
   string id = 2;
   // A value indicating whether the filter is present.
   bool is_present = 3;
   // The position index, starting at 1.
   int32 position = 4;
}
