syntax = "proto3";
package zen_api.lm.slide_scan.v1;

// This enumeration names all possible slide processing states.
enum SlideState {
   // Default value if status is not specified.
   SLIDE_STATE_UNSPECIFIED = 0;
   // Processing was stopped.
   SLIDE_STATE_STOPPED = 1;
   // New (not processed).
   SLIDE_STATE_NEW = 2;
   // Preview currently in work.
   SLIDE_STATE_PREVIEW_IN_PROGRESS = 3;
   // Preview processing finished, but input required.
   SLIDE_STATE_INPUT_REQUIRED = 4;
   // Preview processing finished.
   SLIDE_STATE_PREVIEWED = 5;
   // Scan currently in work.
   SLIDE_STATE_SCAN_IN_PROGRESS = 6;
   // Processing finished.
   SLIDE_STATE_FINISHED = 7;
   // Processing error occurred.
   SLIDE_STATE_ERROR = 8;
   // Slide was skipped by user.
   SLIDE_STATE_SKIPPED = 9;
}
