site_name: ZEN API Utilities 0.1.0
site_url: https://sebi06.github.io/ZEN_API/
site_description: Python wrappers for the ZEN API (ZEISS microscopy platform)
repo_name: sebi06/ZEN_API
repo_url: https://github.com/sebi06/ZEN_API
use_directory_urls: false
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
theme:
  name: material
  icon:
    logo: material/microscope
    repo: fontawesome/brands/github
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: blue
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: blue grey
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - search.highlight
  - search.suggest
  - content.code.copy
  - content.code.annotate
  - navigation.indexes
  - navigation.footer
  - navigation.sections
  - navigation.expand
  - toc.follow
markdown_extensions:
- admonition
- attr_list
- pymdownx.details
- pymdownx.highlight:
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- toc:
    permalink: '#'
plugins:
- search
- autorefs:
    resolve_closest: true
- mkdocstrings:
    handlers:
      python:
        options:
          docstring_style: google
          docstring_section_style: list
          show_root_heading: true
          show_symbol_type_heading: true
          show_symbol_type_toc: true
          show_signature_annotations: true
          separate_signature: true
          merge_init_into_class: true
          members_order: source
          filters:
          - '!^_'
          show_if_no_docstring: true
          show_source: false
          heading_level: 2
          summary: true
extra:
  version:
    provider: mike
docs_dir: F:\GitHub\ZEN_API\zen_api_utils_package\docs\_mkdocs_src
site_dir: F:\GitHub\ZEN_API\zen_api_utils_package\docs\mkdocs_site
nav:
- Home: index.md
- API Reference:
  - Cameras: reference/cameras.md
  - Changers: reference/changers.md
  - Experiment: reference/experiment.md
  - Experiment Acquisition: reference/experiment_acquisition.md
  - Extract Czexp Plan: reference/extract_czexp_plan.md
  - Filters: reference/filters.md
  - Misc: reference/misc.md
  - Objective: reference/objective.md
  - Sample Carrier: reference/sample_carrier.md
  - Stage: reference/stage.md
  - Streaming:
    - acquisition: reference/streaming/acquisition.md
    - frames: reference/streaming/frames.md
    - geometry: reference/streaming/geometry.md
    - metrics: reference/streaming/metrics.md
    - omezarr: reference/streaming/omezarr.md
    - pipeline: reference/streaming/pipeline.md
    - receiver: reference/streaming/receiver.md
    - streaming: reference/streaming.md
  - Tiles Positions: reference/tiles_positions.md
  - Workflow: reference/workflow.md
  - Zen Tcpip: reference/zen_tcpip.md
  - Zen Tcpip Commands: reference/zen_tcpip_commands.md
  - Zen Tcpip Interface: reference/zen_tcpip_interface.md
  - Zencontrol Short: reference/zencontrol_short.md
